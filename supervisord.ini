[supervisord]
nodaemon=true

[program:X11]
command=/usr/bin/Xvfb :0 -screen 0 1024x768x24
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared
environment=DISPLAY=":0"
autorestart=true

[program:startxfce4]
command=/usr/bin/xfce4-session
user=user
environment=HOME="/home/user",DISPLAY=":0"
autorestart=true

[program:noVNC]
command=/src/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 8080
autorestart=true
